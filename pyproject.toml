[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EmadSoheili" }
]
requires-python = ">=3.9"
dependencies = [
    "black>=25.11.0",
    "google-genai>=1.47.0",
    "isort>=6.1.0",
    "langchain-community>=0.3.31",
    "langchain-google-genai>=2.1.12",
    "langchain-tavily>=0.2.11",
    "langgraph>=0.6.11",
    "langsmith>=0.4.37",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.8.1",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
